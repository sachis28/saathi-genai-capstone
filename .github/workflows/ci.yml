# CI: runs on every pull request and every push to main.
# Three jobs: Python tests + RAG evaluation gate, .NET tests, and Docker image builds.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      RETRIEVER: local
      INTENT_PROVIDER: tfidf_lr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements.txt }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r api/requirements.txt
      - name: Pin the Radar runtime to the Azure ML deployment versions
        run: pip install -r ml/azureml/requirements-local.txt
      - name: Train the small intent and Radar models used by the API
        run: python -m ml.train_intent && python -m ml.radar
      - name: Tests, including the Red-Team Arena release gate
        run: python -m pytest -q
        env: { REDTEAM_REPORT: "1" }
      - name: 50-query RAG evaluation (fails if Recall@5 < 0.85 or off-topic redirects miss)
        run: python rag/evaluate_rag.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          path: |
            docs/rag_evaluation_report.md
            docs/evidence/rag_eval_mock-local.json
            docs/evidence/redteam_results.json
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet test dotnet/Saathi.slnx
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t saathi-api .
      - name: API image starts and answers /health
        run: |
          docker run -d -p 8000:8000 --name api saathi-api
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 3; done
          docker logs api; exit 1
      - name: Build the web image
        run: docker build -t saathi-web dotnet
