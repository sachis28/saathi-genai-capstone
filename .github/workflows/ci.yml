name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      RETRIEVER: local
      INTENT_PROVIDER: tfidf_lr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements.txt }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r api/requirements.txt
      - name: Pin the Radar runtime to the Azure ML deployment versions
        run: pip install -r ml/azureml/requirements-local.txt
      - name: Train the small intent and Radar models used by the API
        run: python -m ml.train_intent && python -m ml.radar
      - run: python -m pytest -q
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet test dotnet/Saathi.slnx
